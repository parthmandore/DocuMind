name: DocuMind CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Unit Tests & Security Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      AI_PROVIDER: ollama
      OLLAMA_HOST: http://127.0.0.1:11434
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core & Security Unit Tests
        run: |
          python -m pytest tests/ -v

  frontend-checks:
    name: Frontend Tests, TypeScript & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Test Suites
        run: npm test

      - name: Verify TypeScript & Production Vite Build
        run: npm run build
