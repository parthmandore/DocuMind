name: DocuMind CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Integrity & Import Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      AI_PROVIDER: groq
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Integrity & Application Readiness
        run: |
          python -c "import backend.config, backend.api.app, backend.main; print('Backend integrity verified!')"

  frontend-checks:
    name: Frontend TypeScript & Production Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Production Vite Build
        run: npm run build
