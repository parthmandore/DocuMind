<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuMind — Local AI Document Intelligence</title>
    <meta name="description" content="Local-first AI document intelligence, research workspace, and citation verification engine." />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="DocuMind" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DocuMind — Local AI Document Intelligence" />
    <meta property="og:description" content="Local-first AI document intelligence, research workspace, and citation verification engine." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocuMind — Local AI Document Intelligence" />
    <meta name="twitter:description" content="Local-first AI document intelligence, research workspace, and citation verification engine." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4F46E5" />

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('documind_theme_mode');
          var mode = stored ? JSON.parse(stored) : 'dark';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-gray-100 antialiased selection:bg-brand/30 selection:text-brand-light min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
